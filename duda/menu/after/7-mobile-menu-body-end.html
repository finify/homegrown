<!--
  Sunderland Home Grown redesign: PHONE AND TABLET HEADER AND MENU (same design as the prototype)
  Where: Site Settings > Body end HTML (paste at the end, after file 6 if you use it).

  Where it shows: phones (Duda's mobile layout) and tablets (screens 1024px wide or less).
  Rotating a tablet or resizing a window across 1024px switches it on and off automatically.
  What it does:
    - logo on the left, a "Menu" button on the right
    - the button's three lines turn into an X and the label changes to "Close"
    - a full-screen green menu fades and slides in, with the links, "Make an enquiry" and "Call"
  The links are read from Duda's own menu, so they still come from the Pages panel.
  If this script doesn't run, phones show Duda's own mobile menu (styled by file 5) and
  tablets show the two-row header (styled by file 4) instead.
  Accessible: real button with aria-expanded, Escape closes, focus moves into the menu and back.
-->
<style>
  html.shg-m-on #slideRightNav { display: none !important; }
  html.shg-m-on #dmSlideRightNavRight { padding-top: 72px !important; transform: none !important; }
  html.shg-m-on #dmSlideRightNavLeft { display: none !important; }
  html.shg-m-locked, html.shg-m-locked body { overflow: hidden !important; }

  /* Tablets: hide the regular header (and the old sidebar layout, if still used); make room for the bar */
  html.shg-m-tablet #dm .dmInner div.dmHeader,
  html.shg-m-tablet .stickyHeaderSpacer,
  html.shg-m-tablet #siteSidebar,
  html.shg-m-tablet #siteSidebarSpacer { display: none !important; }
  html.shg-m-tablet body { padding-top: 80px !important; }

  /* The bar and panel only exist on screen while the phone/tablet menu is switched on */
  .shg-m-bar, .shg-m-panel { display: none !important; }
  html.shg-m-on .shg-m-bar { display: flex !important; }
  html.shg-m-on .shg-m-panel { display: block !important; }

  .shg-m-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100000;
    height: 72px; padding: 0 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: rgba(246, 247, 242, 0.97);
    font-family: 'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', system-ui, sans-serif;
  }
  .shg-m-logo { display: inline-flex; border-radius: 4px; }
  .shg-m-bar .shg-m-logo img { display: block; height: 40px !important; width: auto !important; max-width: 60vw !important; }
  .shg-m-toggle {
    display: inline-flex; align-items: center; gap: 10px;
    min-height: 48px; padding: 0 18px;
    border: 0; border-radius: 1.5rem 0.25rem; cursor: pointer;
    background: #173A22; color: #fff;
    font: 700 17px/1 'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', system-ui, sans-serif;
    transition: transform .18s ease, background-color .18s ease;
  }
  .shg-m-toggle:active { transform: scale(.97); }
  .shg-m-toggle:focus-visible, .shg-m-panel a:focus-visible, .shg-m-logo:focus-visible {
    outline: 3px solid #E9B82B; outline-offset: 3px;
  }
  .shg-m-logo:focus-visible { outline-color: #173A22; }
  .shg-m-icon { position: relative; display: block; width: 20px; height: 16px; }
  .shg-m-icon span {
    position: absolute; left: 0; width: 20px; height: 3px; border-radius: 3px; background: currentColor;
    transition: transform .3s cubic-bezier(.22, 1, .36, 1), opacity .2s ease, top .3s cubic-bezier(.22, 1, .36, 1);
  }
  .shg-m-icon span:nth-child(1) { top: 0; }
  .shg-m-icon span:nth-child(2) { top: 6.5px; }
  .shg-m-icon span:nth-child(3) { top: 13px; }
  .shg-m-toggle[aria-expanded="true"] .shg-m-icon span:nth-child(1) { top: 6.5px; transform: rotate(45deg); }
  .shg-m-toggle[aria-expanded="true"] .shg-m-icon span:nth-child(2) { opacity: 0; }
  .shg-m-toggle[aria-expanded="true"] .shg-m-icon span:nth-child(3) { top: 6.5px; transform: rotate(-45deg); }

  .shg-m-panel {
    position: fixed; top: 72px; left: 0; right: 0; bottom: 0; z-index: 99999;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 24px 16px 40px;
    background: #173A22; color: #fff;
    font-family: 'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', system-ui, sans-serif;
    visibility: hidden; opacity: 0; transform: translateY(-12px);
    transition: opacity .3s ease, transform .35s cubic-bezier(.22, 1, .36, 1), visibility 0s linear .35s;
  }
  .shg-m-panel.is-open {
    visibility: visible; opacity: 1; transform: none;
    transition: opacity .3s ease, transform .35s cubic-bezier(.22, 1, .36, 1), visibility 0s;
  }
  .shg-m-panel ul { list-style: none; margin: 0; padding: 0; }
  .shg-m-panel li { margin: 0 0 4px; opacity: 0; transform: translateY(10px); transition: opacity .35s ease, transform .4s cubic-bezier(.22, 1, .36, 1); }
  .shg-m-panel.is-open li { opacity: 1; transform: none; }
  .shg-m-panel nav a {
    display: flex; align-items: center; gap: 12px;
    min-height: 56px; padding: 0 12px;
    border-radius: 1.5rem 0.25rem;
    color: #fff !important; text-decoration: none !important;
    font-size: 26px; font-weight: 700; line-height: 1.15;
  }
  .shg-m-panel nav a::before {
    content: ""; flex: none; width: 14px; height: 14px; border-radius: 0 100% 0 100%; background: #3DB82A;
  }
  .shg-m-panel nav a[href*="day-opportunities"]::before { background: #E9B82B; }
  .shg-m-panel nav a[aria-current="page"] { background: #1F4D2E; }
  .shg-m-actions { display: grid; gap: 12px; margin-top: 32px; }
  .shg-m-btn {
    display: flex; align-items: center; justify-content: center;
    min-height: 52px; padding: 0 20px; border-radius: 1.5rem 0.25rem;
    font-size: 18px; font-weight: 700; text-decoration: none !important;
  }
  .shg-m-btn--gold { background: #E9B82B; color: #173A22 !important; }
  .shg-m-btn--white { background: #fff; color: #173A22 !important; }

  /* Tablet sizing: a taller bar, bigger logo, and the menu contents kept to a readable width */
  html.shg-m-tablet .shg-m-bar { height: 80px; padding: 0 32px; }
  html.shg-m-tablet .shg-m-bar .shg-m-logo img { height: 48px !important; }
  html.shg-m-tablet .shg-m-toggle { min-height: 52px; padding: 0 22px; font-size: 18px; }
  html.shg-m-tablet .shg-m-panel { top: 80px; padding: 48px 32px 56px; }
  html.shg-m-tablet .shg-m-panel nav,
  html.shg-m-tablet .shg-m-actions { max-width: 640px; margin-left: auto; margin-right: auto; }
  html.shg-m-tablet .shg-m-panel nav a { min-height: 64px; font-size: 32px; }
  html.shg-m-tablet .shg-m-actions { grid-template-columns: 1fr 1fr; margin-top: 40px; }

  @media (prefers-reduced-motion: reduce) {
    .shg-m-panel, .shg-m-panel li, .shg-m-icon span, .shg-m-toggle { transition: none !important; }
  }
</style>
<script>
(function () {
  // Settings: change these if the page address or phone number changes.
  var LOGO = 'https://irp-cdn.multiscreensite.com/0432dc74/dms3rep/multi/Sunderland_Homegrown_Lozenge_1000x285_RGB-dee94023-f0dd5d88-c6017153.png';
  var ENQUIRY = '/day-opportunities#register';
  var PHONE = { href: 'tel:+441915499444', label: 'Call 0191 549 9444' };

  // MENU LINKS: copy these from the desktop menu's custom links (same text, same addresses).
  // Duda's mobile layout doesn't include the desktop custom-link menu, so phones read it from here.
  // Add, remove or reorder lines to change the phone menu. Leave the list empty ([]) to use
  // Duda's own page list instead.
  var LINKS = [
    { text: 'Day opportunities', href: '/day-opportunities' },
    { text: 'Garden centre', href: '/garden-centre' },
    { text: "What's on", href: '/whats-on' },
    { text: 'Community', href: '/community' },
    { text: 'About', href: '/about' },
    { text: 'Contact & find us', href: '/contact' },
  ];

  function build() {
    var source = document.getElementById('leftSidebar');
    // Phones: Duda's mobile layout. Tablets: the desktop page with our header, 1024px wide or less.
    var dudaMobile = !!source && document.body.classList.contains('dmMobileBody');
    var hasHeader = !!document.querySelector('.shg-header');
    if ((!dudaMobile && !hasHeader) || document.querySelector('.shg-m-bar')) return;
    var tabletQuery = window.matchMedia('(max-width: 1024px)');

    var el = function (tag, attrs, html) {
      var n = document.createElement(tag);
      for (var k in attrs) n.setAttribute(k, attrs[k]);
      if (html != null) n.innerHTML = html;
      return n;
    };

    var bar = el('div', { class: 'shg-m-bar', role: 'banner' });
    var logo = el('a', { class: 'shg-m-logo', href: '/' });
    logo.appendChild(el('img', { src: LOGO, alt: 'Sunderland Home Grown, home page', width: '148', height: '42' }));
    var toggle = el('button', { class: 'shg-m-toggle', type: 'button', 'aria-expanded': 'false', 'aria-controls': 'shg-m-panel' },
      '<span class="shg-m-icon" aria-hidden="true"><span></span><span></span><span></span></span><span class="shg-m-label">Menu</span>');
    bar.appendChild(logo);
    bar.appendChild(toggle);

    var panel = el('div', { class: 'shg-m-panel', id: 'shg-m-panel' });
    var nav = el('nav', { 'aria-label': 'Main' });
    var list = el('ul');

    // The same links as the desktop menu: only real, visible pages. Skips pages hidden
    // in the Pages panel, Duda's template rows (they contain "${text}" until Duda fills
    // them in) and empty rows.
    var isPlaceholder = function (s) { return !s || /\$\{|\{\{/.test(s); };
    var isHidden = function (node) {
      return node.classList.contains('dmHideFromNav') || node.hasAttribute('hidden') ||
        node.getAttribute('aria-hidden') === 'true' || getComputedStyle(node).display === 'none';
    };
    // Normalise an address so "/about", "/about/" and "https://site/about" all match.
    var pathOf = function (href) {
      try { return new URL(href, location.href).pathname.replace(/\/+$/, '') || '/'; } catch (e) { return href; }
    };
    var here = pathOf(location.href);

    function readItems() {
      // 1. The custom links set above (matches the desktop menu).
      if (LINKS.length) {
        return LINKS.map(function (l) {
          return { text: l.text, href: l.href, target: l.newTab ? '_blank' : null, current: pathOf(l.href) === here };
        });
      }
      var out = [];
      // 2. Otherwise the desktop menu if it's on the page, then Duda's mobile menu.
      var desk = document.querySelectorAll('nav.unifiednav .unifiednav__container:not([data-depth]) > .unifiednav__item-wrap');
      var rows = desk.length ? desk : (source ? source.querySelectorAll(':scope > li') : []);
      for (var i = 0; i < rows.length; i++) {
        var row = rows[i], a = row.querySelector('a');
        if (!a || isHidden(row) || isHidden(a)) continue;
        var textNode = row.querySelector('.nav-item-text, .navItemText') || a;
        var text = textNode.textContent.replace(/\s+/g, ' ').trim();
        var href = a.getAttribute('href');
        if (isPlaceholder(text) || isPlaceholder(href)) continue;
        out.push({
          text: text,
          href: href,
          target: a.getAttribute('target'),
          current: row.classList.contains('dmNavItemSelected') || a.classList.contains('dmNavItemSelected') || a.getAttribute('aria-current') === 'page',
        });
      }
      return out;
    }
    var lastKey = '';
    function fillList() {
      var items = readItems();
      var key = JSON.stringify(items);
      if (key === lastKey) return;
      lastKey = key;
      list.innerHTML = '';
      items.forEach(function (it, i) {
        var li = el('li');
        li.style.transitionDelay = (0.04 * i + 0.05) + 's';
        var link = el('a', { href: it.href });
        if (it.target) link.setAttribute('target', it.target);
        if (it.current) link.setAttribute('aria-current', 'page');
        link.textContent = it.text;
        li.appendChild(link);
        list.appendChild(li);
      });
    }
    fillList();
    // Duda may finish building its menu after this runs: refresh when it changes.
    var watched = source || document.querySelector('.shg-header');
    new MutationObserver(function () { clearTimeout(fillList.t); fillList.t = setTimeout(fillList, 100); })
      .observe(watched, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ['class', 'style', 'href'] });
    window.addEventListener('load', fillList);
    nav.appendChild(list);
    panel.appendChild(nav);
    var actions = el('div', { class: 'shg-m-actions' });
    actions.appendChild(el('a', { class: 'shg-m-btn shg-m-btn--gold', href: ENQUIRY }, 'Make an enquiry'));
    actions.appendChild(el('a', { class: 'shg-m-btn shg-m-btn--white', href: PHONE.href }, PHONE.label));
    panel.appendChild(actions);

    document.body.insertBefore(panel, document.body.firstChild);
    document.body.insertBefore(bar, document.body.firstChild);
    var label = toggle.querySelector('.shg-m-label');
    function setOpen(open, returnFocus) {
      toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      label.textContent = open ? 'Close' : 'Menu';
      panel.classList.toggle('is-open', open);
      document.documentElement.classList.toggle('shg-m-locked', open);
      if (open) {
        var first = panel.querySelector('a');
        if (first) setTimeout(function () { first.focus(); }, 50);
      } else if (returnFocus) {
        toggle.focus();
      }
    }
    toggle.addEventListener('click', function () { setOpen(toggle.getAttribute('aria-expanded') !== 'true'); });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && panel.classList.contains('is-open')) setOpen(false, true);
    });
    panel.addEventListener('click', function (e) { if (e.target.closest('a')) setOpen(false); });

    // Switch the phone/tablet menu on or off for the current screen width.
    function apply() {
      var on = dudaMobile || tabletQuery.matches;
      var root = document.documentElement;
      if (!on && panel.classList.contains('is-open')) setOpen(false);
      root.classList.toggle('shg-m-on', on);
      root.classList.toggle('shg-m-tablet', on && !dudaMobile);
    }
    apply();
    if (tabletQuery.addEventListener) tabletQuery.addEventListener('change', apply);
    else if (tabletQuery.addListener) tabletQuery.addListener(apply);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', build);
  else build();
})();
</script>
