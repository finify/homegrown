<!--
  ============================================================================
  LINK SETUP: paste these ONCE, then style changes come from GitHub automatically.
  ============================================================================
  The CSS and JS live in this repo and are published to GitHub Pages on every push.
  The 123-reg site loads them from there, so pushing a change updates the live site
  within about 10 minutes. No more copying CSS into the three device panels.

  You still paste the header HTML (duda/menu/after/2-header.html) and the footer HTML
  (duda/footer/after/footer.html) once each. Their look comes from the files below.

  Before you switch over: remove the CSS you pasted earlier from the three CSS panels
  (everything after the original code; your backups are in duda/*/before/),
  and remove the old snippets from Body end HTML. Otherwise the rules load twice.
-->

<!-- 1. HEAD HTML (Site Settings > Head HTML), paste at the end -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://finify.github.io/homegrown/duda/base.css">
<link rel="stylesheet" href="https://finify.github.io/homegrown/duda/header.css">
<link rel="stylesheet" href="https://finify.github.io/homegrown/duda/footer.css">
<link rel="stylesheet" href="https://finify.github.io/homegrown/duda/shop.css">

<!-- 2. BODY END HTML (Site Settings > Body end HTML), paste at the end -->
<script src="https://finify.github.io/homegrown/duda/site.js" defer></script>
